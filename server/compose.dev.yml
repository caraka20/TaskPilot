services:
  mysql:
    image: mysql:8.4
    container_name: taskpilot-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskpilot
      MYSQL_USER: taskpilot
      MYSQL_PASSWORD: taskpilot_dev_password
      MYSQL_ROOT_PASSWORD: taskpilot_root_dev_password
    ports:
      - '3307:3306'
    volumes:
      - taskpilot_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  taskpilot_mysql_data:
